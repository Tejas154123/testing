<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS // Tool Deck</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00f0ff;
            --secondary-color: #ff2bd6;
            --background-color: #121212;
            --card-background: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --border-radius: 15px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--background-color);
            color: var(--text-color);
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        p {
            font-size: 1.2rem;
            margin-top: 10px;
        }

        .tool {
            background: var(--card-background);
            border-radius: var(--border-radius);
            padding: 20px;
            margin: 15px;
            width: 250px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.5s ease-in-out;
        }

        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .tool:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 240, 255, 0.7);
        }

        button {
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s, transform 0.2s;
        }

        button:hover {
            background: darkviolet;
            transform: scale(1.05);
        }

        footer {
            margin-top: 2rem;
            font-size: 0.9rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-background);
            border-radius: var(--border-radius);
            padding: 20px;
            width: 300px;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        .close {
            cursor: pointer;
            color: var(--primary-color);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1>NEXUS: High-Tech Tool Deck</h1>
        <p>Explore a suite of powerful tools designed for engineers and researchers.</p>
    </header>

    <div class="tool">
        <h2>Mission Clock</h2>
        <button onclick="showMissionClock()">Open</button>
    </div>
    <div class="tool">
        <h2>Password Generator</h2>
        <button onclick="generatePassword()">Generate</button>
    </div>
    <div class="tool">
        <h2>JSON Formatter</h2>
        <button onclick="formatJSON()">Format</button>
    </div>
    <div class="tool">
        <h2>Base64 Codec</h2>
        <button onclick="base64Codec()">Codec</button>
    </div>
    <div class="tool">
        <h2>SHA-256 Hasher</h2>
        <button onclick="hashSHA256()">Hash</button>
    </div>
    <div class="tool">
        <h2>Light-Delay Calculator</h2>
        <button onclick="calculateLightDelay()">Calculate</button>
    </div>
    <div class="tool">
        <h2>System Telemetry</h2>
        <button onclick="showTelemetry()">Show</button>
    </div>

    <footer>
        &copy; 2023 NEXUS Tools. All Rights Reserved.
    </footer>

    <!-- Modal for displaying results -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-text"></div>
        </div>
    </div>

    <script>
        function showModal(text) {
            document.getElementById('modal-text').innerText = text;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function showMissionClock() {
            showModal("Mission Clock is activated!");
        }

        function generatePassword() {
            const password = Math.random().toString(36).slice(-8);
            showModal("Password generated: " + password);
        }

        function formatJSON() {
            const json = prompt("Enter JSON to format:");
            try {
                const formatted = JSON.stringify(JSON.parse(json), null, 2);
                showModal(formatted);
            } catch (e) {
                showModal("Invalid JSON!");
            }
        }

        function base64Codec() {
            const text = prompt("Enter text to encode/decode:");
            const encoded = btoa(text);
            const decoded = atob(encoded);
            showModal(`Encoded: ${encoded}\nDecoded: ${decoded}`);
        }

        async function hashSHA256() {
            const text = prompt("Enter text to hash:");
            const hashed = await sha256(text);
            showModal("Hashed: " + hashed);
        }

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => ('00' + b.toString(16)).slice(-2)).join('');
        }

        function calculateLightDelay() {
            const distance = prompt("Enter distance in kilometers:");
            const time = (distance / 300000) * 1000; // Light speed in km/s
            showModal("Light will take: " + time + " milliseconds");
        }

        function showTelemetry() {
            showModal("System Telemetry: CPU Usage, Memory Consumption, etc.");
        }
    </script>
</body>
</html>
