<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROBO LAB & SENSOR-LAB Portfolio</title>
  
  <!-- Google Fonts: Jockey One & Josefin Slab -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jockey+One&family=Josefin+Slab:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-black text-slate-200">

  <!-- Header -->
  <header class="header-container">
    <div class="header-row">
      <div class="header-left">
        <div class="header-badge-row">
          <div class="hazard-stripes hazard-bar"></div>
          <div class="hazard-line"></div>
          <span id="page-indicator" class="page-indicator">PAGE 01</span>
        </div>

        <!-- Dynamic Title: ROBO LAB / SENSOR-LAB in straight line -->
        <div class="title-wrapper">
          <div class="corner-bracket"></div>
          <h1 id="main-title" class="font-jockey lab-title">ROBO LAB</h1>
        </div>

        <div class="under-title-row">
          <div class="hazard-stripes hazard-bar-sm"></div>
          <div class="circuit-line">
            <div class="circuit-trace"></div>
            <div class="circuit-tick"></div>
            <div class="circuit-trace-faded"></div>
          </div>
        </div>
      </div>

      <!-- Right Header Controls -->
      <div class="header-right">
        <!-- Mechanical Industrial Gear -->
        <div class="gear-container">
          <svg class="gear-svg" viewBox="0 0 100 100" fill="none">
            <path d="M50 20 A30 30 0 0 1 71.21 28.79 L77.5 22.5 L84 29 L77.71 35.29 A30 30 0 0 1 80 50 L89 50 L89 59 L80 59 A30 30 0 0 1 71.21 71.21 L77.5 77.5 L71 84 L64.71 77.71 A30 30 0 0 1 50 80 L50 89 L41 89 L41 80 A30 30 0 0 1 28.79 71.21 L22.5 77.5 L16 71 L22.29 64.71 A30 30 0 0 1 20 50 L11 50 L11 41 L20 41 A30 30 0 0 1 28.79 28.79 L22.5 22.5 L29 16 L35.29 22.29 A30 30 0 0 1 50 20 Z" stroke="#f59e0b" stroke-width="3" fill="none" />
            <circle cx="50" cy="50" r="14" stroke="#f59e0b" stroke-width="3" fill="none" />
            <circle cx="50" cy="50" r="5" fill="#f59e0b" />
          </svg>
        </div>

        <!-- Quick Switcher -->
        <div class="page-switcher">
          <button id="nav-btn-1" class="page-btn active" onclick="switchPage(1)">Page 1</button>
          <span class="switcher-slash">/</span>
          <button id="nav-btn-2" class="page-btn" onclick="switchPage(2)">Page 2</button>
        </div>
      </div>
    </div>
    <div class="header-divider"></div>
  </header>

  <!-- Main Projects List Container -->
  <main id="projects-container" class="projects-container"></main>

  <!-- Footer Navigation -->
  <footer class="footer-container">
    <div class="footer-inner">
      <div class="footer-actions">
        <button class="top-btn" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">
          ▲ TOP OF PAGE
        </button>

        <button id="main-page-toggle" class="main-toggle-btn" onclick="toggleNextPage()">
          <span id="main-page-toggle-text">PROCEED TO PAGE 2</span> ➔
        </button>

        <div id="footer-page-badge" class="footer-badge">PAGE [01 / 02]</div>
      </div>

      <div class="bottom-hazard-wrap">
        <div class="bottom-line-tech">
          <div class="tech-line-yellow"></div>
          <div class="tech-bracket-notch"></div>
          <div class="tech-line-short"></div>
        </div>
        <div class="bottom-stripes-row">
          <div class="hazard-stripes bottom-stripe-1"></div>
          <div class="bottom-spacer-line"></div>
          <div class="hazard-stripes bottom-stripe-2"></div>
        </div>
      </div>
    </div>
  </footer>

  <!-- Main JavaScript File -->
  <script src="script.js"></script>
</body>
</html>
